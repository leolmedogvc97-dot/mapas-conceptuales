<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Visual Interactivo - Ley Penal y Tipos Penales</title>
    
    <!-- Tailwind CSS para Interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF para exportación vectorial a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            user-select: none;
            overflow: hidden;
            background-color: #f1f5f9;
        }
        
        #workspace {
            cursor: grab;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        #workspace:active {
            cursor: grabbing;
        }

        .node-card {
            position: absolute;
            cursor: move;
            transition: border 0.15s ease, box-shadow 0.15s ease;
            touch-action: none;
        }

        .node-card.selected {
            outline: 3px solid #3b82f6 !important;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }

        svg.connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 10000px;
            height: 10000px;
            pointer-events: none;
        }

        svg.connections-layer path, svg.connections-layer text {
            pointer-events: visiblePainted;
            cursor: pointer;
        }

        .line-selected {
            stroke: #3b82f6 !important;
            stroke-width: 3.5px !important;
        }

        /* Ocultar barra de scroll en paneles */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col font-sans">

    <!-- BARRA SUPERIOR (TOOLBAR) -->
    <header class="h-14 bg-slate-900 text-white flex items-center justify-between px-4 z-40 border-b border-slate-700 shadow-md">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-base text-blue-400">Editor Penal U2</span>
            <span class="text-slate-500">|</span>
            <button onclick="agregarNodoPrompt()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1 transition">➕ Nuevo Concepto</button>
            <button onclick="activarModoConexion()" id="btn-connect" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1 transition">🔗 Nueva Conexión</button>
            <button onclick="eliminarSeleccionado()" class="bg-rose-600 hover:bg-rose-500 px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1 transition">🗑️ Eliminar</button>
        </div>

        <!-- Controles de Historial y Zoom -->
        <div class="flex items-center space-x-2">
            <button onclick="deshacer()" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded text-xs">↶ Deshacer</button>
            <button onclick="rehacer()" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded text-xs">↷ Rehacer</button>
            <span class="text-slate-500">|</span>
            <button onclick="cambiarZoom(-0.1)" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded text-xs font-bold">➖</button>
            <span id="zoom-indicator" class="text-xs font-mono w-12 text-center">100%</span>
            <button onclick="cambiarZoom(0.1)" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded text-xs font-bold">➕</button>
            <button onclick="resetZoom()" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded text-xs">↔ Restablecer</button>
        </div>

        <!-- Guardado y Exportación -->
        <div class="flex items-center space-x-2">
            <button onclick="guardarJSON()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded text-xs font-semibold">💾 Guardar</button>
            <label class="bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded text-xs font-semibold cursor-pointer">
                📂 Cargar <input type="file" id="file-input" onchange="cargarJSON(event)" class="hidden">
            </label>
            <span class="text-slate-500">|</span>
            <button onclick="exportarPNG()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs font-semibold">🖼️ PNG</button>
            <button onclick="exportarSVG()" class="bg-purple-600 hover:bg-purple-500 px-3 py-1.5 rounded text-xs font-semibold">📐 SVG</button>
            <button onclick="exportarPDF()" class="bg-teal-600 hover:bg-teal-500 px-3 py-1.5 rounded text-xs font-semibold">📄 PDF</button>
        </div>
    </header>

    <div class="flex-1 flex relative overflow-hidden">
        <!-- LIENZO PRINCIPAL (WORKSPACE) -->
        <main id="workspace" class="flex-1 relative overflow-hidden w-full h-full">
            <div id="canvas-container" class="absolute top-0 left-0 w-[10000px] h-[10000px] origin-top-left">
                <svg id="svg-layer" class="connections-layer">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                        </marker>
                        <marker id="arrow-selected" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
                        </marker>
                    </defs>
                </svg>
                <!-- Nodos insertados dinámicamente -->
                <div id="nodes-container"></div>
            </div>
        </main>

        <!-- PANEL LATERAL DE PROPIEDADES -->
        <aside id="inspector-panel" class="w-80 bg-white border-l border-slate-200 shadow-xl flex flex-col z-30">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-sm">Panel de Estilos</h3>
                <span id="target-type" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-mono">Ninguno</span>
            </div>
            
            <div id="inspector-content" class="p-4 space-y-4 overflow-y-auto flex-1 no-scrollbar text-xs">
                <p class="text-slate-400 text-center py-8">Selecciona un cuadro o una línea de conexión para editar sus propiedades visuales.</p>
            </div>
        </aside>
    </div>

    <!-- SISTEMA INTERACTIVO JS -->
    <script>
        // Estructura de Datos Nativa inicial (Mapa Conceptual Unidad 2 Derecho Penal completísimo)
        let appState = {
            zoom: 1,
            pan: { x: 50, y: 50 },
            nodes: [
                { id: "root", title: "CARACTERÍSTICAS DE LA LEY PENAL Y TIPOS PENALES", text: "Programa Oficial Unidad 2 | Mir Puig & Díaz-Aranda", x: 250, y: 40, bg: "#1e293b", color: "#ffffff", border: "#0f172a", fontSize: 16, width: 480 },
                { id: "ley", title: "1. La Ley Penal", text: "Norma jurídica estatal que determina delitos y sanciones", x: 60, y: 160, bg: "#eff6ff", color: "#1e40af", border: "#3b82f6", fontSize: 13, width: 260 },
                { id: "ley_est", title: "Estructura de la Norma", text: "• Supuesto de Hecho: Conducta prohibida/mandada\n• Consecuencia Jurídica: Pena/Medida de seguridad", x: 60, y: 280, bg: "#ffffff", color: "#1e293b", border: "#94a3b8", fontSize: 12, width: 260 },
                { id: "tipo", title: "2. El Tipo Penal", text: "Descripción concreta de la conducta delictiva en la ley", x: 440, y: 160, bg: "#eff6ff", color: "#1e40af", border: "#3b82f6", fontSize: 13, width: 260 },
                { id: "dim", title: "Dimensiones Dogmáticas", text: "• Tipo de Injusto: Materia de la prohibición y desvalor\n• Tipo Amplio: Presupuestos para la punibilidad", x: 440, y: 280, bg: "#ffffff", color: "#1e293b", border: "#94a3b8", fontSize: 12, width: 260 },
                { id: "func", title: "3. Funciones del Tipo Penal", text: "1. Seleccionadora: Protege Bienes Jurídicos graves\n2. De Garantía: Nullum crimen sine lege\n3. Motivadora: Incita a abstenerse de delinquir", x: 440, y: 420, bg: "#fefce8", color: "#854d0e", border: "#eab308", fontSize: 12, width: 270 },
                { id: "elem", title: "4. Elementos del Tipo Penal", text: "Estructura tripartita del Injusto Penal", x: 440, y: 560, bg: "#f3e8ff", color: "#6b21a8", border: "#a855f7", fontSize: 13, width: 260 },
                { id: "obj", title: "A. Tipo Objetivo (Material)", text: "• Acción / Omisión humana\n• Sujeto Activo, Pasivo y Estado\n• Objeto Material y Bien Jurídico Tutelado\n• Nexo Causal e Imputación Objetiva\n• Resultado material (si se exige)", x: 120, y: 680, bg: "#ffffff", color: "#1e293b", border: "#c084fc", fontSize: 11, width: 250 },
                { id: "subj", title: "B. Tipo Subjetivo (Psíquico)", text: "Procesos internos y voluntad del autor", x: 440, y: 680, bg: "#faf5ff", color: "#581c87", border: "#c084fc", fontSize: 12, width: 250 },
                { id: "norm", title: "C. Elementos Normativos", text: "Términos que requieren valoración cultural o jurídico-formal", x: 740, y: 680, bg: "#ffffff", color: "#1e293b", border: "#c084fc", fontSize: 11, width: 240 },
                { id: "dolo", title: "El Dolo", text: "Conocimiento y voluntad de realizar el tipo objetivo\n• Dolo 1er Grado: Intención directa\n• Dolo 2do Grado: Consecuencias necesarias\n• Dolo Eventual: Acepta el resultado posible", x: 340, y: 830, bg: "#ffffff", color: "#1e293b", border: "#d8b4fe", fontSize: 11, width: 240 },
                { id: "culpa", title: "Delito Culposo / Imprudente", text: "Infracción al deber objetivo de cuidado\n• Culpa Consciente: Confía en evitarlo\n• Culpa Inconsciente: No prevé pudiendo prever", x: 610, y: 830, bg: "#ffffff", color: "#1e293b", border: "#d8b4fe", fontSize: 11, width: 240 },
                { id: "clas", title: "5. Clasificación de los Tipos", text: "• Por el resultado: Mera Actividad vs. Resultado\n• Temporalidad: Instantáneo, Permanente y Continuado\n• Afectación: Lesión vs. Peligro (Concreto/Abstracto)\n• Sujetos: Unisubjetivo vs. Plurisubjetivo", x: 60, y: 1010, bg: "#ecfdf5", color: "#065f46", border: "#10b981", fontSize: 11, width: 310 },
                { id: "sanc", title: "6. Fases de la Sanción Penal", text: "1. Punibilidad (Legislativa): Amenaza abstracta\n2. Punición (Judicial): Fijación por el Juez\n3. Pena (Ejecutiva): Reinserción Social", x: 440, y: 1010, bg: "#fff7ed", color: "#9a3412", border: "#f97316", fontSize: 11, width: 290 }
            ],
            connections: [
                { id: "c1", from: "root", to: "ley", label: "define marco de", color: "#64748b", width: 2, dashed: false },
                { id: "c2", from: "ley", to: "ley_est", label: "se conforma de", color: "#94a3b8", width: 1.5, dashed: false },
                { id: "c3", from: "root", to: "tipo", label: "se concreta en", color: "#64748b", width: 2, dashed: false },
                { id: "c4", from: "tipo", to: "dim", label: "se analiza mediante", color: "#94a3b8", width: 1.5, dashed: false },
                { id: "c5", from: "tipo", to: "func", label: "desempeña", color: "#64748b", width: 1.5, dashed: false },
                { id: "c6", from: "tipo", to: "elem", label: "se estructura en", color: "#64748b", width: 2, dashed: false },
                { id: "c7", from: "elem", to: "obj", label: "dimensión material", color: "#a855f7", width: 1.5, dashed: false },
                { id: "c8", from: "elem", to: "subj", label: "dimensión psíquica", color: "#a855f7", width: 1.5, dashed: false },
                { id: "c9", from: "elem", to: "norm", label: "valoración", color: "#a855f7", width: 1.5, dashed: false },
                { id: "c10", from: "subj", to: "dolo", label: "modalidad", color: "#c084fc", width: 1.5, dashed: false },
                { id: "c11", from: "subj", to: "culpa", label: "modalidad", color: "#c084fc", width: 1.5, dashed: false },
                { id: "c12", from: "tipo", to: "clas", label: "se clasifica en", color: "#10b981", width: 1.5, dashed: false },
                { id: "c13", from: "tipo", to: "sanc", label: "determina", color: "#f97316", width: 1.5, dashed: false }
            ]
        };

        let selectedNodeId = null;
        let selectedConnectionId = null;
        let connectingSourceId = null;
        let historyStack = [];
        let redoStack = [];

        // Inicialización de la Interfaz
        window.onload = () => {
            guardarHistorial();
            render();
            setupPanZoom();
            setupKeyboardShortcuts();
        };

        function guardarHistorial() {
            if (historyStack.length > 30) historyStack.shift();
            historyStack.push(JSON.stringify({ nodes: appState.nodes, connections: appState.connections }));
            redoStack = [];
        }

        function deshacer() {
            if (historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                const state = JSON.parse(historyStack[historyStack.length - 1]);
                appState.nodes = state.nodes;
                appState.connections = state.connections;
                render();
            }
        }

        function rehacer() {
            if (redoStack.length > 0) {
                const stateStr = redoStack.pop();
                historyStack.push(stateStr);
                const state = JSON.parse(stateStr);
                appState.nodes = state.nodes;
                appState.connections = state.connections;
                render();
            }
        }

        // Renderizador Vectorial del Lienzo
        function render() {
            const container = document.getElementById("nodes-container");
            const svgLayer = document.getElementById("svg-layer");
            container.innerHTML = "";
            
            // Limpiar líneas anteriores excepto defs
            const defs = svgLayer.querySelector("defs");
            svgLayer.innerHTML = "";
            svgLayer.appendChild(defs);

            // Renderizar Nodos
            appState.nodes.forEach(node => {
                const div = document.createElement("div");
                div.className = `node-card p-3 rounded-lg shadow-md border ${selectedNodeId === node.id ? 'selected' : ''}`;
                div.id = `node-${node.id}`;
                div.style.left = `${node.x}px`;
                div.style.top = `${node.y}px`;
                div.style.width = `${node.width || 220}px`;
                div.style.backgroundColor = node.bg;
                div.style.borderColor = node.border;
                div.style.color = node.color;
                div.style.fontSize = `${node.fontSize}px`;

                div.innerHTML = `
                    <div class="font-bold border-b border-black/10 pb-1 mb-1 pointer-events-none">${node.title}</div>
                    <div class="whitespace-pre-wrap pointer-events-none opacity-90">${node.text}</div>
                `;

                div.addEventListener("mousedown", (e) => iniciarArrastreNodo(e, node.id));
                div.addEventListener("dblclick", () => editarTextoNodo(node.id));
                div.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (connectingSourceId) {
                        finalizarConexion(node.id);
                    } else {
                        seleccionarNodo(node.id);
                    }
                });

                container.appendChild(div);
            });

            // Renderizar Conexiones
            appState.connections.forEach(conn => {
                const fromNode = appState.nodes.find(n => n.id === conn.from);
                const toNode = appState.nodes.find(n => n.id === conn.to);
                if (!fromNode || !toNode) return;

                const pos = calcularPuntosConexion(fromNode, toNode);
                
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                // Línea curva Bezier
                const dx = pos.x2 - pos.x1;
                const dy = pos.y2 - pos.y1;
                const d = `M ${pos.x1} ${pos.y1} C ${pos.x1 + dx/2} ${pos.y1}, ${pos.x2 - dx/2} ${pos.y2}, ${pos.x2} ${pos.y2}`;
                
                path.setAttribute("d", d);
                path.setAttribute("stroke", selectedConnectionId === conn.id ? "#3b82f6" : conn.color);
                path.setAttribute("stroke-width", selectedConnectionId === conn.id ? conn.width + 1.5 : conn.width);
                path.setAttribute("fill", "none");
                if (conn.dashed) path.setAttribute("stroke-dasharray", "4,4");
                path.setAttribute("marker-end", selectedConnectionId === conn.id ? "url(#arrow-selected)" : "url(#arrow)");
                if (selectedConnectionId === conn.id) path.classList.add("line-selected");

                path.addEventListener("click", (e) => {
                    e.stopPropagation();
                    seleccionarConexion(conn.id);
                });

                g.appendChild(path);

                // Etiqueta de la Línea (Palabra de enlace)
                if (conn.label) {
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    const midX = (pos.x1 + pos.x2) / 2;
                    const midY = (pos.y1 + pos.y2) / 2;

                    text.setAttribute("x", midX);
                    text.setAttribute("y", midY - 5);
                    text.setAttribute("fill", "#475569");
                    text.setAttribute("font-size", "11px");
                    text.setAttribute("font-weight", "600");
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("class", "bg-white px-1");
                    text.textContent = conn.label;

                    text.addEventListener("dblclick", (e) => {
                        e.stopPropagation();
                        editarTextoConexion(conn.id);
                    });

                    g.appendChild(text);
                }

                svgLayer.appendChild(g);
            });

            renderInspector();
        }

        // Cálculo dinámico de puntos de borde entre rectángulos
        function calcularPuntosConexion(n1, n2) {
            const w1 = n1.width || 220;
            const h1 = document.getElementById(`node-${n1.id}`)?.offsetHeight || 80;
            const w2 = n2.width || 220;
            const h2 = document.getElementById(`node-${n2.id}`)?.offsetHeight || 80;

            const c1 = { x: n1.x + w1 / 2, y: n1.y + h1 / 2 };
            const c2 = { x: n2.x + w2 / 2, y: n2.y + h2 / 2 };

            return {
                x1: c1.x < c2.x ? n1.x + w1 : n1.x,
                y1: c1.y,
                x2: c2.x < c1.x ? n2.x + w2 : n2.x,
                y2: c2.y
            };
        }

        // Arrastre e Interacción de Nodos
        function iniciarArrastreNodo(e, id) {
            if (e.button !== 0 || connectingSourceId) return;
            e.stopPropagation();
            seleccionarNodo(id);

            const node = appState.nodes.find(n => n.id === id);
            const startX = e.clientX;
            const startY = e.clientY;
            const initialX = node.x;
            const initialY = node.y;

            function mover(e) {
                node.x = initialX + (e.clientX - startX) / appState.zoom;
                node.y = initialY + (e.clientY - startY) / appState.zoom;
                render();
            }

            function soltar() {
                window.removeEventListener("mousemove", mover);
                window.removeEventListener("mouseup", soltar);
                guardarHistorial();
            }

            window.addEventListener("mousemove", mover);
            window.addEventListener("mouseup", soltar);
        }

        // Pan & Zoom en Lienzo
        function setupPanZoom() {
            const workspace = document.getElementById("workspace");
            let isPanning = false;
            let startX, startY;

            workspace.addEventListener("mousedown", (e) => {
                if (e.target === workspace || e.target.tagName === "svg") {
                    isPanning = true;
                    startX = e.clientX - appState.pan.x;
                    startY = e.clientY - appState.pan.y;
                    seleccionarNada();
                }
            });

            window.addEventListener("mousemove", (e) => {
                if (!isPanning) return;
                appState.pan.x = e.clientX - startX;
                appState.pan.y = e.clientY - startY;
                actualizarTransform();
            });

            window.addEventListener("mouseup", () => isPanning = false);

            workspace.addEventListener("wheel", (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.05 : 0.05;
                cambiarZoom(delta);
            });
        }

        function cambiarZoom(delta) {
            appState.zoom = Math.min(Math.max(0.3, appState.zoom + delta), 2.5);
            document.getElementById("zoom-indicator").textContent = `${Math.round(appState.zoom * 100)}%`;
            actualizarTransform();
        }

        function resetZoom() {
            appState.zoom = 1;
            appState.pan = { x: 50, y: 50 };
            document.getElementById("zoom-indicator").textContent = "100%";
            actualizarTransform();
        }

        function actualizarTransform() {
            const container = document.getElementById("canvas-container");
            container.style.transform = `translate(${appState.pan.x}px, ${appState.pan.y}px) scale(${appState.zoom})`;
        }

        // Selección y Panel de Inspección
        function seleccionarNodo(id) {
            selectedNodeId = id;
            selectedConnectionId = null;
            render();
        }

        function seleccionarConexion(id) {
            selectedConnectionId = id;
            selectedNodeId = null;
            render();
        }

        function seleccionarNada() {
            selectedNodeId = null;
            selectedConnectionId = null;
            renderInspector();
            render();
        }

        function renderInspector() {
            const panel = document.getElementById("inspector-content");
            const targetType = document.getElementById("target-type");

            if (selectedNodeId) {
                const node = appState.nodes.find(n => n.id === selectedNodeId);
                targetType.textContent = "Nodo";
                panel.innerHTML = `
                    <div>
                        <label class="font-semibold block mb-1">Título</label>
                        <input type="text" value="${node.title}" oninput="actualizarNodoProp('title', this.value)" class="w-full border rounded p-1.5">
                    </div>
                    <div>
                        <label class="font-semibold block mb-1">Contenido / Texto</label>
                        <textarea rows="4" oninput="actualizarNodoProp('text', this.value)" class="w-full border rounded p-1.5">${node.text}</textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="font-semibold block mb-1">Fondo</label>
                            <input type="color" value="${rgbaToHex(node.bg)}" onchange="actualizarNodoProp('bg', this.value)" class="w-full h-8 rounded cursor-pointer">
                        </div>
                        <div>
                            <label class="font-semibold block mb-1">Borde</label>
                            <input type="color" value="${rgbaToHex(node.border)}" onchange="actualizarNodoProp('border', this.value)" class="w-full h-8 rounded cursor-pointer">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="font-semibold block mb-1">Color Texto</label>
                            <input type="color" value="${rgbaToHex(node.color)}" onchange="actualizarNodoProp('color', this.value)" class="w-full h-8 rounded cursor-pointer">
                        </div>
                        <div>
                            <label class="font-semibold block mb-1">Tam. Letra (px)</label>
                            <input type="number" value="${node.fontSize}" onchange="actualizarNodoProp('fontSize', parseInt(this.value))" class="w-full border rounded p-1.5">
                        </div>
                    </div>
                    <div>
                        <label class="font-semibold block mb-1">Ancho (px)</label>
                        <input type="number" value="${node.width || 220}" onchange="actualizarNodoProp('width', parseInt(this.value))" class="w-full border rounded p-1.5">
                    </div>
                `;
            } else if (selectedConnectionId) {
                const conn = appState.connections.find(c => c.id === selectedConnectionId);
                targetType.textContent = "Conexión";
                panel.innerHTML = `
                    <div>
                        <label class="font-semibold block mb-1">Palabra de Enlace</label>
                        <input type="text" value="${conn.label || ''}" oninput="actualizarConnProp('label', this.value)" class="w-full border rounded p-1.5">
                    </div>
                    <div>
                        <label class="font-semibold block mb-1">Color de Línea</label>
                        <input type="color" value="${rgbaToHex(conn.color)}" onchange="actualizarConnProp('color', this.value)" class="w-full h-8 rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="font-semibold block mb-1">Grosor (px)</label>
                        <input type="number" value="${conn.width}" onchange="actualizarConnProp('width', parseFloat(this.value))" class="w-full border rounded p-1.5">
                    </div>
                    <div class="flex items-center space-x-2 pt-2">
                        <input type="checkbox" id="dash-check" ${conn.dashed ? 'checked' : ''} onchange="actualizarConnProp('dashed', this.checked)">
                        <label for="dash-check" class="font-semibold">Línea Punteada</label>
                    </div>
                `;
            } else {
                targetType.textContent = "Ninguno";
                panel.innerHTML = `<p class="text-slate-400 text-center py-8">Selecciona un cuadro o una línea de conexión para editar sus propiedades visuales.</p>`;
            }
        }

        function actualizarNodoProp(prop, val) {
            const node = appState.nodes.find(n => n.id === selectedNodeId);
            if (node) {
                node[prop] = val;
                render();
            }
        }

        function actualizarConnProp(prop, val) {
            const conn = appState.connections.find(c => c.id === selectedConnectionId);
            if (conn) {
                conn[prop] = val;
                render();
            }
        }

        function rgbaToHex(colorStr) {
            if (colorStr.startsWith('#')) return colorStr;
            return "#3b82f6";
        }

        // Operaciones CRUD
        function agregarNodoPrompt() {
            const title = prompt("Título del concepto:", "Nuevo Concepto");
            if (!title) return;
            const text = prompt("Descripción / Contenido:", "Detalle o subtemas");
            
            const newNode = {
                id: "node_" + Date.now(),
                title: title,
                text: text || "",
                x: 300 - appState.pan.x,
                y: 200 - appState.pan.y,
                bg: "#ffffff",
                color: "#1e293b",
                border: "#3b82f6",
                fontSize: 12,
                width: 220
            };

            appState.nodes.push(newNode);
            guardarHistorial();
            seleccionarNodo(newNode.id);
        }

        function activarModoConexion() {
            if (!selectedNodeId) {
                alert("Primero selecciona el nodo de origen haciéndole clic.");
                return;
            }
            connectingSourceId = selectedNodeId;
            document.getElementById("btn-connect").classList.add("ring-2", "ring-yellow-400");
            alert("Ahora haz clic en el nodo de destino.");
        }

        function finalizarConexion(targetId) {
            if (connectingSourceId && connectingSourceId !== targetId) {
                const label = prompt("Palabra de enlace (opcional):", "se relaciona con");
                appState.connections.push({
                    id: "conn_" + Date.now(),
                    from: connectingSourceId,
                    to: targetId,
                    label: label || "",
                    color: "#64748b",
                    width: 1.5,
                    dashed: false
                });
                guardarHistorial();
            }
            connectingSourceId = null;
            document.getElementById("btn-connect").classList.remove("ring-2", "ring-yellow-400");
            render();
        }

        function editarTextoNodo(id) {
            const node = appState.nodes.find(n => n.id === id);
            const title = prompt("Editar Título:", node.title);
            if (title !== null) {
                const text = prompt("Editar Contenido (usa \\n para saltos de línea):", node.text);
                if (text !== null) {
                    node.title = title;
                    node.text = text;
                    guardarHistorial();
                    render();
                }
            }
        }

        function editarTextoConexion(id) {
            const conn = appState.connections.find(c => c.id === id);
            const label = prompt("Editar palabra de enlace:", conn.label);
            if (label !== null) {
                conn.label = label;
                guardarHistorial();
                render();
            }
        }

        function eliminarSeleccionado() {
            if (selectedNodeId) {
                if (confirm("¿Eliminar este concepto y sus conexiones?")) {
                    appState.nodes = appState.nodes.filter(n => n.id !== selectedNodeId);
                    appState.connections = appState.connections.filter(c => c.from !== selectedNodeId && c.to !== selectedNodeId);
                    selectedNodeId = null;
                    guardarHistorial();
                    render();
                }
            } else if (selectedConnectionId) {
                if (confirm("¿Eliminar esta conexión?")) {
                    appState.connections = appState.connections.filter(c => c.id !== selectedConnectionId);
                    selectedConnectionId = null;
                    guardarHistorial();
                    render();
                }
            }
        }

        function setupKeyboardShortcuts() {
            window.addEventListener("keydown", (e) => {
                if (e.key === "Delete" || e.key === "Backspace") {
                    if (document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
                        eliminarSeleccionado();
                    }
                }
            });
        }

        // Guardar & Cargar Proyecto JSON
        function guardarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `Mapa_Penal_U2_Proyecto.json`);
            dlAnchorElem.click();
        }

        function cargarJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = (e) => {
                try {
                    const loadedState = JSON.parse(e.target.result);
                    if (loadedState.nodes && loadedState.connections) {
                        appState = loadedState;
                        guardarHistorial();
                        render();
                    }
                } catch (err) {
                    alert("Archivo JSON inválido.");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        // EXPORTACIÓN A SVG, PNG Y PDF (Cero pixelado)
        function exportarSVG() {
            const svgLayer = document.getElementById("svg-layer").cloneNode(true);
            const container = document.getElementById("nodes-container").cloneNode(true);
            
            const wrapper = document.createElement("svg");
            wrapper.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            wrapper.setAttribute("width", "3000");
            wrapper.setAttribute("height", "2500");
            wrapper.style.backgroundColor = "#ffffff";

            // Inyectar HTML renderizado en foreignObject para SVG vectorial perfecto
            const foreignObject = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
            foreignObject.setAttribute("width", "100%");
            foreignObject.setAttribute("height", "100%");
            
            const style = document.createElement("style");
            style.textContent = `
                .node-card { position: absolute; font-family: sans-serif; padding: 12px; border-radius: 8px; border: 1px solid; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                .font-bold { font-weight: bold; }
                .whitespace-pre-wrap { white-space: pre-wrap; }
            `;
            
            foreignObject.appendChild(style);
            foreignObject.appendChild(container);
            
            wrapper.appendChild(svgLayer);
            wrapper.appendChild(foreignObject);

            const blob = new Blob([wrapper.outerHTML], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Mapa_Conceptual_Unidad2.svg";
            a.click();
        }

        function exportarPNG() {
            alert("Generando PNG en Ultra HD (4x)...");
            const svgLayer = document.getElementById("svg-layer").cloneNode(true);
            const container = document.getElementById("nodes-container").cloneNode(true);
            
            const canvas = document.createElement("canvas");
            canvas.width = 3200;
            canvas.height = 2400;
            const ctx = canvas.getContext("2d");

            const img = new Image();
            const svgString = `
                <svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2400">
                    <rect width="100%" height="100%" fill="#ffffff"/>
                    <foreignObject width="100%" height="100%">
                        <div xmlns="http://www.w3.org/1999/xhtml">
                            <style>
                                .node-card { position: absolute; font-family: sans-serif; padding: 12px; border-radius: 8px; border: 1px solid; }
                                .font-bold { font-weight: bold; }
                                .whitespace-pre-wrap { white-space: pre-wrap; }
                            </style>
                            ${container.innerHTML}
                        </div>
                    </foreignObject>
                    ${svgLayer.innerHTML}
                </svg>
            `;

            const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const pngUrl = canvas.toDataURL("image/png");
                const a = document.createElement("a");
                a.href = pngUrl;
                a.download = "Mapa_Conceptual_Unidad2_HD.png";
                a.click();
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            alert("Exportando PDF A4...");
            
            // Reutiliza render PNG para incrustar en PDF nítido
            const canvas = document.createElement("canvas");
            canvas.width = 2400;
            canvas.height = 3200;
            const ctx = canvas.getContext("2d");
            const img = new Image();

            const svgString = `
                <svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3200">
                    <rect width="100%" height="100%" fill="#ffffff"/>
                    <foreignObject width="100%" height="100%">
                        <div xmlns="http://www.w3.org/1999/xhtml">
                            <style>
                                .node-card { position: absolute; font-family: sans-serif; padding: 10px; border-radius: 6px; border: 1px solid; }
                                .font-bold { font-weight: bold; }
                                .whitespace-pre-wrap { white-space: pre-wrap; }
                            </style>
                            ${document.getElementById("nodes-container").innerHTML}
                        </div>
                    </foreignObject>
                    ${document.getElementById("svg-layer").innerHTML}
                </svg>
            `;

            const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);

            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const imgData = canvas.toDataURL("image/png");
                pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
                pdf.save("Mapa_Conceptual_Unidad2.pdf");
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
    </script>
</body>
</html>
