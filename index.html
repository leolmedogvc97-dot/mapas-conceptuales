<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMap & Timeline Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --panel-bg: #ffffff;
      --border-color: #e0e6ed;
      --text-color: #2c3e50;
      --primary-color: #3b82f6;
      --accent-color: #10b981;
      --timeline-line: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */
    .header-toolbar {
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .header-toolbar h1 {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #475569;
    }

    .btn-primary {
      background: var(--primary-color);
    }
    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-toggle {
      background: #0ea5e9;
    }
    .btn-toggle:hover {
      background: #0284c7;
    }

    /* ÁREA DE TRABAJO (CANVAS) */
    .canvas-area {
      flex: 1;
      overflow: auto;
      position: relative;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      padding: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* LINEA DE TIEMPO */
    .timeline-wrapper {
      position: relative;
      transition: all 0.3s ease;
      display: flex;
    }

    /* Orientación Horizontal */
    .timeline-wrapper.horizontal {
      flex-direction: row;
      align-items: center;
      min-width: max-content;
      padding: 100px 50px;
    }

    .timeline-wrapper.horizontal .timeline-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 6px;
      background: var(--timeline-line);
      border-radius: 3px;
      z-index: 1;
    }

    /* Orientación Vertical */
    .timeline-wrapper.vertical {
      flex-direction: column;
      align-items: center;
      min-height: max-content;
      padding: 50px 100px;
    }

    .timeline-wrapper.vertical .timeline-axis {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 6px;
      background: var(--timeline-line);
      border-radius: 3px;
      z-index: 1;
    }

    /* HITOS / ETAPAS DE LA LÍNEA DE TIEMPO */
    .timeline-item {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
    }

    /* Layout Horizontal alternado */
    .timeline-wrapper.horizontal .timeline-item {
      flex-direction: column;
      margin: 0 40px;
      width: 280px;
    }

    .timeline-wrapper.horizontal .timeline-item.top {
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .timeline-wrapper.horizontal .timeline-item.bottom {
      justify-content: flex-start;
      margin-top: 20px;
    }

    /* Layout Vertical alternado */
    .timeline-wrapper.vertical .timeline-item {
      flex-direction: row;
      margin: 30px 0;
      width: 600px;
    }

    .timeline-wrapper.vertical .timeline-item.left {
      justify-content: flex-end;
      padding-right: 40px;
    }

    .timeline-wrapper.vertical .timeline-item.right {
      justify-content: flex-start;
      padding-left: 40px;
    }

    /* TARJETA DE ETAPA / EVENTO */
    .card-stage {
      background: #ffffff;
      border: 2px solid #3b82f6;
      border-radius: 14px;
      width: 100%;
      max-width: 300px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card-stage:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px -5px rgba(0,0,0,0.12);
    }

    /* ENCABEZADO CON AÑO */
    .year-input-wrapper {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 4px 10px;
      margin-bottom: 12px;
      width: max-content;
    }

    .year-input-wrapper span {
      font-size: 0.85rem;
      margin-right: 6px;
      color: #64748b;
    }

    .year-input {
      border: none;
      background: transparent;
      font-weight: 700;
      color: #1e293b;
      font-size: 1rem;
      width: 70px;
      outline: none;
    }

    .stage-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #0f172a;
      border: none;
      outline: none;
      width: 100%;
      margin-bottom: 8px;
    }

    .stage-desc {
      font-size: 0.9rem;
      color: #475569;
      border: none;
      outline: none;
      width: 100%;
      resize: none;
      min-height: 48px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* IMAGEN DE LA ETAPA (OPCIONAL) */
    .image-container {
      position: relative;
      margin-bottom: 12px;
      border-radius: 10px;
      overflow: hidden;
      max-height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-remove-img {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SECCIÓN DE COMENTARIOS (DIRECTAMENTE EN EL CUADRO) */
    .comments-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }

    .comments-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comment-item {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.83rem;
      color: #334155;
      margin-bottom: 6px;
      position: relative;
      word-break: break-word;
    }

    .comment-item .btn-del-comment {
      float: right;
      border: none;
      background: transparent;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: 4px;
    }

    .add-comment-form {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .input-comment {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      outline: none;
    }

    .btn-add-comment {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* ACCIONES DE LA TARJETA */
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
    }

    .file-input-label {
      font-size: 0.8rem;
      color: #3b82f6;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .file-input-label input {
      display: none;
    }

    .btn-delete-card {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- BARRA DE HERRAMIENTAS -->
  <div class="header-toolbar">
    <h1>📅 Línea de Tiempo interactiva</h1>
    <div class="btn-group">
      <button class="btn btn-toggle" onclick="toggleOrientation()">
        🔄 Orientación: <span id="orientationLabel">Horizontal</span>
      </button>
      <button class="btn btn-primary" onclick="addStage()">
        ➕ Agregar Etapa
      </button>
    </div>
  </div>

  <!-- CANVAS PRINCIPAL -->
  <div class="canvas-area">
    <div id="timelineWrapper" class="timeline-wrapper horizontal">
      <div class="timeline-axis"></div>
    </div>
  </div>

  <script>
    let isHorizontal = true;

    // Datos por defecto
    let stages = [
      {
        id: 'stage-1',
        year: '1995',
        title: 'Inicio del Proyecto',
        description: 'Fundación y definición de los primeros objetivos institucionales.',
        imageUrl: '',
        comments: ['Se inició con un presupuesto reducido.', 'Revisión aprobada por la mesa directiva.']
      },
      {
        id: 'stage-2',
        year: '2006',
        title: 'Lanzamiento Oficial',
        description: 'Apertura al público general y expansión de servicios.',
        imageUrl: '',
        comments: ['Llegamos a los primeros 10,000 usuarios activos.']
      },
      {
        id: 'stage-3',
        year: '2018',
        title: 'Modernización',
        description: 'Actualización tecnológica completa e integración de nuevas herramientas.',
        imageUrl: '',
        comments: ['Se rediseñó por completo la arquitectura del sistema.']
      }
    ];

    function toggleOrientation() {
      isHorizontal = !isHorizontal;
      const wrapper = document.getElementById('timelineWrapper');
      const label = document.getElementById('orientationLabel');
      
      if (isHorizontal) {
        wrapper.className = 'timeline-wrapper horizontal';
        label.textContent = 'Horizontal';
      } else {
        wrapper.className = 'timeline-wrapper vertical';
        label.textContent = 'Vertical';
      }
      renderTimeline();
    }

    function addStage() {
      const newId = 'stage-' + Date.now();
      const lastYear = stages.length > 0 ? parseInt(stages[stages.length - 1].year) || 2020 : 2020;
      
      stages.push({
        id: newId,
        year: (lastYear + 5).toString(),
        title: 'Nueva Etapa',
        description: 'Descripción breve de los acontecimientos de este periodo.',
        imageUrl: '',
        comments: []
      });

      renderTimeline();
    }

    function deleteStage(index) {
      stages.splice(index, 1);
      renderTimeline();
    }

    function handleImageUpload(event, index) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          stages[index].imageUrl = e.target.result;
          renderTimeline();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage(index) {
      stages[index].imageUrl = '';
      renderTimeline();
    }

    function addComment(index, inputId) {
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (text) {
        stages[index].comments.push(text);
        renderTimeline();
      }
    }

    function deleteComment(stageIndex, commentIndex) {
      stages[stageIndex].comments.splice(commentIndex, 1);
      renderTimeline();
    }

    function updateStageData(index, field, value) {
      stages[index][field] = value;
    }

    function renderTimeline() {
      const wrapper = document.getElementById('timelineWrapper');
      wrapper.innerHTML = '<div class="timeline-axis"></div>';

      stages.forEach((stage, idx) => {
        const item = document.createElement('div');
        
        if (isHorizontal) {
          item.className = `timeline-item ${idx % 2 === 0 ? 'top' : 'bottom'}`;
        } else {
          item.className = `timeline-item ${idx % 2 === 0 ? 'left' : 'right'}`;
        }

        const inputCommentId = `comment-input-${idx}`;

        const commentsHtml = stage.comments.map((c, cIdx) => `
          <div class="comment-item">
            ${c}
            <button class="btn-del-comment" onclick="deleteComment(${idx}, ${cIdx})">✕</button>
          </div>
        `).join('');

        const cardHtml = `
          <div class="card-stage">
            <div class="year-input-wrapper">
              <span>📅 Año:</span>
              <input type="number" class="year-input" value="${stage.year}" onchange="updateStageData(${idx}, 'year', this.value)" />
            </div>

            <input type="text" class="stage-title" value="${stage.title}" oninput="updateStageData(${idx}, 'title', this.value)" placeholder="Título de etapa" />
            <textarea class="stage-desc" oninput="updateStageData(${idx}, 'description', this.value)" placeholder="¿Qué pasó en esta etapa?">${stage.description}</textarea>

            ${stage.imageUrl ? `
              <div class="image-container">
                <img src="${stage.imageUrl}" alt="Imagen de la etapa" />
                <button class="btn-remove-img" onclick="removeImage(${idx})">✕</button>
              </div>
            ` : ''}

            <!-- COMENTARIOS VISIBLES DENTRO DE LA TARJETA -->
            <div class="comments-box">
              <div class="comments-header">💬 Comentarios (${stage.comments.length})</div>
              ${commentsHtml}
              <div class="add-comment-form">
                <input type="text" id="${inputCommentId}" class="input-comment" placeholder="Agregar comentario..." onkeypress="if(event.key==='Enter') addComment(${idx}, '${inputCommentId}')" />
                <button class="btn-add-comment" onclick="addComment(${idx}, '${inputCommentId}')">+</button>
              </div>
            </div>

            <!-- ACCIONES -->
            <div class="card-actions">
              <label class="file-input-label">
                🖼️ ${stage.imageUrl ? 'Cambiar imagen' : 'Agregar imagen'}
                <input type="file" accept="image/*" onchange="handleImageUpload(event, ${idx})">
              </label>
              <button class="btn-delete-card" onclick="deleteStage(${idx})">Eliminar</button>
            </div>
          </div>
        `;

        item.innerHTML = cardHtml;
        wrapper.appendChild(item);
      });
    }

    renderTimeline();
  </script>
</body>
</html>
